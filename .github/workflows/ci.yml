name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests, migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: osu
          POSTGRES_PASSWORD: osu
          POSTGRES_DB: osu_coach
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U osu -d osu_coach"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://osu:osu@localhost:5432/osu_coach
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest -q
      - name: Database tests (real Postgres, separate test database)
        run: uv run pytest -m integration tests/integration/test_models_live.py -q
      - name: Migrations apply, match models, and roll back
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base

  compose:
    name: docker compose up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Check /health
        run: curl --fail --silent --show-error http://localhost:8000/health
      - name: Check worker is up
        run: docker compose exec -T worker celery -A osu_coach.worker inspect ping --timeout 20
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop stack
        if: always()
        run: docker compose down --volumes
